name: LaTeX manuscript

on:
  push:
  pull_request:

jobs:
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Tectonic binary
        run: |
          curl -L --fail --silent --show-error \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/tectonic.tar.gz
          tar -xzf /tmp/tectonic.tar.gz -C /tmp
          sudo mv /tmp/tectonic /usr/local/bin/tectonic
      - name: Install PDF text checker
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Compile manuscript
        run: tectonic paper/manuscript.tex --outdir paper
      - name: Check PDF text
        run: |
          pdftotext paper/manuscript.pdf /tmp/manuscript.txt
          if grep -q '??' /tmp/manuscript.txt; then
            echo 'Undefined citation or reference marker found.'
            exit 1
          fi
