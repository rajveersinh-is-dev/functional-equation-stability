[project]
name = "functional-equation-stability-experiments"
version = "0.1.0"
description = "Reproducible counterexample searches for finite-order quadratic stability"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.4.6",
  "scipy==1.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
